<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Двухуровневый">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23232B"/><stop offset="1" stop-color="#15151A"/>
    </linearGradient>
    <radialGradient id="ceil" cx="0.5" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#B68A4E" stop-opacity="0.22"/><stop offset="1" stop-color="#15151A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3530"/><stop offset="0.5" stop-color="#B68A4E" stop-opacity="0.25"/><stop offset="1" stop-color="#15151A"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="0" y="420" width="800" height="180" fill="#000" opacity="0.18"/>
  
      <rect x="96" y="108" width="608" height="300" rx="14" fill="none" stroke="#B68A4E" stroke-width="2.5" opacity="0.85" filter="url(#glow)"/>
      <rect x="96" y="108" width="608" height="300" rx="14" fill="url(#ceil)"/>
  <g font-family="Georgia, serif" fill="#F7F4EF">
    <text x="400" y="516" text-anchor="middle" font-size="36" font-weight="600">Двухуровневый</text>
    <text x="400" y="558" text-anchor="middle" font-size="21" fill="#B68A4E" letter-spacing="2">С ПОДСВЕТКОЙ</text>
  </g>
</svg>